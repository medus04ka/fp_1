name:                soska
version:             0.1.0.0
github:              "githubuser/soska"
license:             BSD-3-Clause
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2025 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/soska#readme>

dependencies:
- base >= 4.7 && < 5
- text
- containers
- bytestring
- mtl
- transformers
- directory
- filepath
- hspec
- QuickCheck
- process
- aeson
- http-client
- http-client-tls
- base64-bytestring

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
- -XOverloadedStrings

library:
  source-dirs: src
  exposed-modules:
    - Music.Core
    - Music.EDSL
    - Music.Transform
    - Music.Analysis
    - Spotify.Model
    - Spotify.Engine
    - Spotify.Library

executables:
  soska-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - soska

tests:
  soska-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - soska
    - hspec
    - QuickCheck